name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  checks: read

jobs:
  verify:
    name: verify release commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify tagged commit belongs to main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify required CI checks passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          check_runs="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")"
          for check_name in "build / test / lint" "docker build"; do
            if ! jq -e --arg name "$check_name" \
              '.check_runs | any(.name == $name and .status == "completed" and .conclusion == "success")' \
              <<<"$check_runs" >/dev/null; then
              echo "required check did not pass: $check_name" >&2
              exit 1
            fi
          done

  goreleaser:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.0"
          cache: true

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The graphical installer is not a Go binary, so GoReleaser cannot produce
  # it: it is an Inno Setup compile that only runs on Windows. Built after the
  # release exists, then attached to it.
  windows-installer:
    needs: goreleaser
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      # -AgentVersion is pinned to the tag being released so the installer a
      # user downloads from a release deploys that release's agent, not
      # whatever is newest whenever they happen to run it. Nebula stays on
      # "latest": it is a separate project on its own cadence.
      - name: Build the installer
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG -replace '^v', ''
          .\deploy\windows\build-installer.ps1 -Version $version -AgentVersion $env:TAG
          $exe = "dist\windows-installer\nebula-mesh-setup-$version.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "installer not produced: $exe" }
          # sha256sum's own format, so `sha256sum -c` verifies the download as-is.
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          Set-Content -Path "$exe.sha256" -Encoding ascii `
            -Value "$hash  nebula-mesh-setup-$version.exe"
          "INSTALLER=$exe" >> $env:GITHUB_ENV

      - name: Attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Via a local: "$env:INSTALLER.sha256" would parse the dot as part of
          # the environment variable's name and expand to nothing.
          $exe = $env:INSTALLER
          gh release upload $env:TAG $exe "$exe.sha256" --clobber
