pki:
  ca: /nebulacompat/ca.crt
  cert: /nebulacompat/host.crt
  key: /nebulacompat/host.key
  blocklist:
    - c99d4e650533b92061b09918e838a5a0a6aaee21eed1d12fd937682865936c72
static_host_map:
  192.168.100.1:
    - 203.0.113.10:4242
lighthouse:
  am_lighthouse: true
listen:
  host: 0.0.0.0
  port: 4242
  windows_bypass_wdf: false
punchy:
  punch: true
  respond: true
tun:
  windows_bypass_wdf: false
  network_category: unset
relay:
  am_relay: true
