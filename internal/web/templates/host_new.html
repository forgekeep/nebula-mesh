{{define "title"}}New Host — Nebula Mesh{{end}}

{{define "content"}}
<h1>New Host</h1>

<div class="card">
    {{if .Error}}<div class="error" role="alert" style="color: var(--danger); margin-bottom: 16px;">{{.Error}}</div>{{end}}
    <form method="POST" action="/ui/hosts">
        <div class="form-group">
            <label>Network</label>
            <select id="network-select" name="network_id" class="form-control" required>
                <option value="">Select network...</option>
                {{$selected := .Form.NetworkID}}
                {{range .Networks}}
                <option value="{{.ID}}" data-cidr="{{.CIDR}}"{{if eq .ID $selected}} selected{{end}}>{{.Name}} ({{.CIDR}})</option>
                {{end}}
            </select>
        </div>
        <div class="form-group">
            <label>Name</label>
            <input type="text" name="name" class="form-control" placeholder="web-1" value="{{.Form.Name}}" required>
        </div>
        <div class="form-group">
            <label>Nebula IP</label>
            <input id="nebula-ip-input" type="text" name="nebula_ip" class="form-control" placeholder="192.168.100.10" value="{{.Form.NebulaIP}}" required>
            <div id="nebula-ip-hint" style="font-size: 12px; color: var(--text-muted); margin-top: 4px;"></div>
        </div>
        <div class="form-group">
            <label>Role</label>
            <select name="role" class="form-control">
                <option value="host"{{if eq .Form.Role "host"}} selected{{end}}>Host</option>
                <option value="lighthouse"{{if eq .Form.Role "lighthouse"}} selected{{end}}>Lighthouse</option>
                <option value="relay"{{if eq .Form.Role "relay"}} selected{{end}}>Relay</option>
            </select>
        </div>
        <div class="form-group">
            <label>Groups (comma-separated)</label>
            <input type="text" name="groups" class="form-control" placeholder="web, prod" value="{{.Form.Groups}}">
        </div>
        <div class="form-group">
            <label>Public IP (for lighthouse/relay)</label>
            <input type="text" name="public_ip" class="form-control" placeholder="203.0.113.10" value="{{.Form.PublicIP}}">
        </div>
        <div class="form-group">
            <label>Listen Port (for lighthouse/relay)</label>
            <input type="number" name="listen_port" class="form-control" placeholder="4242" value="{{.Form.ListenPort}}">
        </div>

        <details style="margin: 16px 0;"{{if or .Form.AdvListenHost .Form.AdvMTU .Form.AdvTunDevice .Form.AdvPunchy .Form.AdvUnsafeRoutes}} open{{end}}>
            <summary style="cursor: pointer; padding: 8px; color: var(--text-muted); font-size: 14px;">
                Advanced configuration (optional)
            </summary>
            <p style="font-size: 12px; color: var(--text-muted); margin: 8px 0;">
                Empty fields inherit the network default. See
                <a href="https://nebula.defined.net/docs/config" target="_blank">Nebula config docs</a>.
            </p>
            <div class="form-group">
                <label>Listen host (advanced.listen_host)</label>
                <input type="text" name="adv_listen_host" class="form-control" placeholder="0.0.0.0" value="{{.Form.AdvListenHost}}">
            </div>
            <div class="form-group">
                <label>TUN MTU (advanced.mtu)</label>
                <input type="number" name="adv_mtu" class="form-control" placeholder="1300" min="576" max="9216" value="{{.Form.AdvMTU}}">
            </div>
            <div class="form-group">
                <label>TUN device name (advanced.tun_device)</label>
                <input type="text" name="adv_tun_device" class="form-control" placeholder="nebula1" value="{{.Form.AdvTunDevice}}">
            </div>
            <div class="form-group">
                <label>Punchy (advanced.punchy)</label>
                <select name="adv_punchy" class="form-control">
                    <option value=""{{if eq .Form.AdvPunchy ""}} selected{{end}}>inherit (true)</option>
                    <option value="true"{{if eq .Form.AdvPunchy "true"}} selected{{end}}>force true</option>
                    <option value="false"{{if eq .Form.AdvPunchy "false"}} selected{{end}}>disable</option>
                </select>
            </div>
            <div class="form-group">
                <label>Unsafe routes (one per line: <code>CIDR via NEBULA_IP</code>)</label>
                <textarea name="adv_unsafe_routes" class="form-control" rows="3" placeholder="192.168.10.0/24 via 10.0.0.99">{{.Form.AdvUnsafeRoutes}}</textarea>
            </div>
        </details>

        <button type="submit" class="btn btn-primary">Create Host</button>
    </form>
</div>

<script>
(function() {
    var sel = document.getElementById("network-select");
    var ipInput = document.getElementById("nebula-ip-input");
    var hint = document.getElementById("nebula-ip-hint");
    if (!sel || !ipInput || !hint) {
        return;
    }

    // computeByteAlignedPrefix returns the immutable octet prefix for a
    // CIDR whose mask is a multiple of 8 (/8, /16, /24), e.g. "10.42.0/24"
    // → "10.42.0.". Returns "" for any other mask — those need a free-form
    // IP, so the JS shows only a hint instead of prefilling.
    function computeByteAlignedPrefix(cidr) {
        var m = /^(\d+)\.(\d+)\.(\d+)\.(\d+)\/(\d+)$/.exec(cidr);
        if (!m) {
            return "";
        }
        var bits = parseInt(m[5], 10);
        if (bits === 8) { return m[1] + "."; }
        if (bits === 16) { return m[1] + "." + m[2] + "."; }
        if (bits === 24) { return m[1] + "." + m[2] + "." + m[3] + "."; }
        return "";
    }

    var lastPrefix = "";

    function update() {
        var opt = sel.options[sel.selectedIndex];
        var cidr = opt ? opt.getAttribute("data-cidr") : "";
        if (!cidr) {
            hint.textContent = "";
            return;
        }
        var prefix = computeByteAlignedPrefix(cidr);
        if (prefix) {
            hint.textContent = "Network " + cidr + " — fill in the host portion only.";
            // Replace the previous auto-filled prefix, but never clobber a
            // value the operator typed in themselves (start of input differs
            // from any known prefix we offered).
            var current = ipInput.value;
            if (current === "" || current === lastPrefix || (lastPrefix !== "" && current.indexOf(lastPrefix) === 0)) {
                ipInput.value = prefix + (current.indexOf(lastPrefix) === 0 ? current.slice(lastPrefix.length) : "");
            }
            lastPrefix = prefix;
        } else {
            hint.textContent = "Network " + cidr + " — enter any IP within the range.";
            lastPrefix = "";
        }
    }

    sel.addEventListener("change", update);
    // Run once on load so a re-rendered form (validation failure) or the
    // initial GET with a single network selected still shows the hint.
    update();
})();
</script>
{{end}}
