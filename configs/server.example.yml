listen: ":8080"
data_dir: "/var/lib/nebula-mgmt"
db_path: "/var/lib/nebula-mgmt/nebula.db"
ui_password: ""  # admin password for bcrypt hashing; if empty, auto-generated. admin API key is generated by `nebula-mgmt init` and printed once to stdout.
log_level: "info"

# TLS — both must be set together. If empty, server runs plain HTTP
# (recommended only behind a TLS-terminating reverse proxy like nginx/caddy).
tls_cert: ""
tls_key: ""

# Base64-encoded 32-byte AES-256 master key used to wrap per-CA data keys
# in the cas table (ADR 0002). May also be supplied via the
# NEBULA_MGMT_MASTER_KEY env var. Required for per-operator CAs; when
# unset, only the legacy single-CA flow works.
#   openssl rand -base64 32
master_key: ""

# Allow unauthenticated visitors to register their own operator account via
# /ui/register. Default is false: only the seeded admin (or an existing admin
# calling POST /api/v1/operators) can add operators in a closed deployment.
allow_self_registration: false

# Optional /metrics Prometheus exporter. Defaults to enabled; set false in
# air-gapped deployments to drop the route. Legacy Go expvar stays on
# /debug/vars regardless.
# metrics:
#   prometheus: true

# Cert-expiry alerter (issue #41). Disabled by default. When enabled, a
# periodic scanner fans out alerts for hosts whose current certificate
# expires inside `threshold` and that have not yet been alerted.
#
# Sinks:
#   - audit log entry with action="cert.expiring" (always on when enabled)
#   - HTTPS webhook (optional) — POSTs JSON, HMAC-SHA256 signed via the
#     X-Nebula-Signature: sha256=<hex> header when `webhook_hmac_secret` is set.
#
# alerts:
#   enabled: true
#   interval: "5m"
#   threshold: "72h"
#   webhook_url: "https://alertmanager.example.com/api/v2/alerts"
#   webhook_hmac_secret: "change-me"

# Per-IP rate limiter (issue #52). Enabled by default; set `enabled: false`
# in trusted networks. When the management server runs behind a reverse
# proxy that adds X-Forwarded-For, set `trust_proxy_header: true` so the
# limiter keys on the real client IP instead of the proxy's RemoteAddr.
#
# rate_limit:
#   enabled: true
#   trust_proxy_header: false
#   groups:
#     auth:        { rate: 5,  burst: 10 }   # /ui/login, /ui/register, /ui/2fa/*, /ui/oidc/callback
#     ui:          { rate: 30, burst: 60 }   # all other /ui/* routes
#     api:         { rate: 30, burst: 60 }   # bearer-authenticated /api/v1/*
#     enroll:      { rate: 2,  burst: 5 }    # /api/v1/enroll
#     agent_poll:  { rate: 60, burst: 120 }  # /api/v1/agent/updates

# Password policy (issue #48). Defaults: min 10 chars, 3-of-4 character
# classes (lower/upper/digit/symbol), reject the embedded "common
# passwords" list, reject passwords equal-to or containing the username.
# All fields are optional — unset = production default.
#
# password:
#   min_length:       10
#   require_classes:  3
#   block_common:     true
#   block_username:   true

# Admin-enforced 2FA (issue #49). Defaults off. When true, local
# operators without TOTP are gated into /ui/2fa/required immediately
# after a successful password login; OIDC operators are exempt. The
# value is persisted into server_settings on startup so the future
# Settings UI (#47) can flip it without a restart.
# enforce_2fa: false

# Default lifetime applied to freshly minted enrollment tokens (ADR 0004 / #75).
# A per-network override can be set at runtime via the `network_config` table
# under the `enrollment_token_ttl` key. Empty / unparseable value falls back
# to 24h.
# enrollment_token_ttl: "24h"

# Optional OpenID Connect identity provider for operator login. When enabled,
# the Web UI offers a "Sign in with SSO" button on top of the local password
# form. Local logins keep working alongside OIDC.
#
# Example: self-hosted Keycloak realm "nebula".
# oidc:
#   enabled: true
#   issuer: "https://keycloak.example.com/realms/nebula"
#   client_id: "nebula-mesh"
#   client_secret: "<from Keycloak client credentials>"
#   redirect_url: "https://mgmt.example.com:8080/ui/oidc/callback"
#   scopes: ["openid", "profile", "email", "groups"]
#   username_claim: "preferred_username"   # default
#   name_claim: "name"                     # default
#   groups_claim: "groups"                 # default
#   allowed_groups: ["nebula-admins"]      # optional allowlist
#   allowed_emails: []                     # optional allowlist
#   # default_role gates who becomes admin on first OIDC login. The server
#   # refuses to start if `default_role` is unset (or "admin") AND both
#   # allowlists are empty — that combination would silently grant admin to
#   # any successful login. To opt into "anyone-who-can-log-in-is-admin",
#   # set `default_role: "admin"` AND at least one allowlist entry (the
#   # two-field footprint is the point).
#   default_role: "user"                   # role for newly-federated users
