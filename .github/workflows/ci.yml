# Fast lane — gates every PR (ADR 0009 §"CI integration (PR-gate vs scheduled)").
# Runs the bounded, deterministic subset: build, `go test -race`, lint, the
# Tier-1 fuzz seed corpora (executed as ordinary `go test`), and — once they
# land — the deterministic Tier-2 invariants. Unbounded generative fuzz and the
# long sim / Tier-3 interop runs live in the scheduled slow lane
# (.github/workflows/scheduled.yml), never here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: static / security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          args: --timeout=5m

      - name: gosec (standalone)
        run: make gosec

      - name: govulncheck
        run: make govulncheck

  race:
    name: test (race) / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: web
            packages: ./internal/web
          - shard: store
            packages: ./internal/store
          - shard: api
            packages: ./internal/api
          - shard: remainder
            packages: ''
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true

      - name: test (race)
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          if [ -n "$PACKAGES" ]; then
            go test -race -count=1 "$PACKAGES"
          else
            go list ./... |
              grep -Ev '/internal/(api|store|web)$' |
              xargs go test -race -count=1
          fi

  test:
    name: build / test / lint
    if: always()
    needs: [checks, race]
    runs-on: ubuntu-latest
    steps:
      - name: verify required jobs
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          RACE_RESULT: ${{ needs.race.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$RACE_RESULT" = success

  windows-agent:
    name: Windows agent service
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
          cache: true

      # nebula_reload_command's Windows half — the cmd.exe command line and the
      # taskkill /T timeout path — is code the build alone never executes.
      # Run the reload hook for real on a Windows host.
      # -run is scoped because the rest of internal/agent still assumes a Unix
      # host; widen it as those tests are ported.
      - name: Test reload command (cmd /C path)
        shell: pwsh
        run: |
          $output = go test -count=1 -v -run 'TestNebulaReloader|TestCappedBuffer' ./internal/agent | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { throw "reload command tests failed" }
          # A -run pattern that matches nothing still exits 0, so require the
          # individual tests to have reported a pass.
          $expected = @(
            'TestNebulaReloader_CommandRuns',
            'TestNebulaReloader_QuotedExecutablePath',
            'TestNebulaReloader_CommandFailureIncludesOutput',
            'TestNebulaReloader_CommandTimesOut',
            'TestNebulaReloader_CapsCommandOutput',
            'TestNebulaReloader_CommandTakesPrecedenceOverPIDFile'
          )
          foreach ($name in $expected) {
            if ($output -notmatch "--- PASS: $name") {
              throw "$name did not run — the cmd /C reload path is unverified"
            }
          }

      - name: Test and build agent
        shell: pwsh
        run: |
          go test -count=1 ./cmd/nebula-agent
          if ($LASTEXITCODE -ne 0) { throw "agent tests failed" }

          $suffix = "${env:GITHUB_RUN_ID}-${env:GITHUB_RUN_ATTEMPT}"
          $installDir = Join-Path $env:ProgramFiles "Nebula Mesh CI-$suffix"
          $dataDir = Join-Path $env:ProgramData "Nebula Mesh CI-$suffix"
          New-Item -ItemType Directory -Force -Path $installDir, $dataDir | Out-Null

          $agentExe = Join-Path $installDir 'nebula-agent.exe'
          go build -o $agentExe ./cmd/nebula-agent
          if ($LASTEXITCODE -ne 0) { throw "agent build failed" }

          $runnerSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $runnerDirectoryGrant = "*${runnerSid}:(OI)(CI)F"
          $runnerFileGrant = "*${runnerSid}:F"
          & icacls.exe $installDir /inheritance:r /grant:r `
            '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' $runnerDirectoryGrant /C
          if ($LASTEXITCODE -ne 0) { throw "failed to protect install directory" }
          & icacls.exe $agentExe /inheritance:r /grant:r `
            '*S-1-5-18:F' '*S-1-5-32-544:F' $runnerFileGrant /C
          if ($LASTEXITCODE -ne 0) { throw "failed to protect agent executable" }
          & icacls.exe $dataDir /inheritance:r /grant:r `
            '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' $runnerDirectoryGrant /C
          if ($LASTEXITCODE -ne 0) { throw "failed to protect data directory" }

          & icacls.exe $installDir
          & icacls.exe $agentExe
          & $agentExe version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "agent executable smoke check failed" }

          $unsafeSids = @('S-1-1-0', 'S-1-5-11', 'S-1-5-32-545')
          $writeMask = [System.Security.AccessControl.FileSystemRights]::Write -bor `
            [System.Security.AccessControl.FileSystemRights]::Modify -bor `
            [System.Security.AccessControl.FileSystemRights]::FullControl
          foreach ($path in @($installDir, $agentExe)) {
            foreach ($entry in (Get-Acl $path).Access) {
              $sid = $entry.IdentityReference.Translate(
                [System.Security.Principal.SecurityIdentifier]
              ).Value
              if ($sid -in $unsafeSids -and
                  $entry.AccessControlType -eq 'Allow' -and
                  ($entry.FileSystemRights -band $writeMask)) {
                throw "unsafe write ACL for $sid on $path"
              }
            }
          }

          "AGENT_EXE=$agentExe" >> $env:GITHUB_ENV
          "AGENT_INSTALL_DIR=$installDir" >> $env:GITHUB_ENV
          "AGENT_DATA_DIR=$dataDir" >> $env:GITHUB_ENV
          "AGENT_CONFIG=$(Join-Path $dataDir 'agent.yml')" >> $env:GITHUB_ENV

      - name: Install, start, stop, and uninstall service
        shell: pwsh
        run: |
          function Wait-ServiceStatus([string]$Name, [string]$Expected) {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              $current = Get-Service -Name $Name -ErrorAction SilentlyContinue
              if ($null -ne $current -and [string]$current.Status -eq $Expected) {
                return
              }
              Start-Sleep -Seconds 1
            }
            throw "service $Name did not reach $Expected"
          }

          $startedAfter = Get-Date
          & $env:AGENT_EXE service install --config $env:AGENT_CONFIG
          if ($LASTEXITCODE -ne 0) { throw "service install failed" }

          $registered = Get-CimInstance Win32_Service -Filter "Name='NebulaMeshAgent'"
          if ($null -eq $registered) { throw "service was not registered" }
          if (-not $registered.PathName.Contains($env:AGENT_EXE)) {
            throw "unexpected ImagePath: $($registered.PathName)"
          }
          if (-not $registered.PathName.Contains($env:AGENT_CONFIG)) {
            throw "config path missing from ImagePath: $($registered.PathName)"
          }
          if ($registered.StartMode -ne 'Auto') {
            throw "StartMode = $($registered.StartMode), want Auto"
          }
          if ($registered.StartName -ne 'LocalSystem') {
            throw "StartName = $($registered.StartName), want LocalSystem"
          }
          $failure = (& sc.exe qfailure NebulaMeshAgent | Out-String)
          if ($failure -notmatch 'RESTART' -or $failure -notmatch '5000') {
            throw "unexpected recovery policy: $failure"
          }

          & $env:AGENT_EXE service start
          if ($LASTEXITCODE -ne 0) { throw "service start failed" }
          Wait-ServiceStatus -Name NebulaMeshAgent -Expected Running
          $running = Get-CimInstance Win32_Service -Filter "Name='NebulaMeshAgent'"
          $serviceProcessId = [int]$running.ProcessId
          if ($serviceProcessId -le 0) { throw "service has no process id" }

          $standbyEvent = $null
          for ($attempt = 0; $attempt -lt 20 -and $null -eq $standbyEvent; $attempt++) {
            $standbyEvent = Get-WinEvent -FilterHashtable @{
              LogName = 'Application'
              ProviderName = 'NebulaMeshAgent'
              StartTime = $startedAfter
            } -ErrorAction SilentlyContinue | Where-Object {
              $_.Message -like '*standby*'
            } | Select-Object -First 1
            if ($null -eq $standbyEvent) { Start-Sleep -Seconds 1 }
          }
          if ($null -eq $standbyEvent) { throw "standby Event Log record not found" }

          & $env:AGENT_EXE service stop
          if ($LASTEXITCODE -ne 0) { throw "service stop failed" }
          Wait-ServiceStatus -Name NebulaMeshAgent -Expected Stopped
          if ($null -ne (Get-Process -Id $serviceProcessId -ErrorAction SilentlyContinue)) {
            throw "service process $serviceProcessId survived stop"
          }

          & $env:AGENT_EXE service uninstall
          if ($LASTEXITCODE -ne 0) { throw "service uninstall failed" }
          if ($null -ne (Get-Service -Name NebulaMeshAgent -ErrorAction SilentlyContinue)) {
            throw "service still exists after uninstall"
          }
          $eventSource = 'HKLM:\SYSTEM\CurrentControlSet\Services\EventLog\Application\NebulaMeshAgent'
          if (Test-Path $eventSource) { throw "Event Log source survived uninstall" }

      - name: Cleanup Windows service
        if: always()
        shell: pwsh
        run: |
          $registered = Get-Service -Name NebulaMeshAgent -ErrorAction SilentlyContinue
          if ($null -ne $registered -and (Test-Path $env:AGENT_EXE)) {
            if ($registered.Status -ne 'Stopped') {
              & $env:AGENT_EXE service stop 2>$null
            }
            & $env:AGENT_EXE service uninstall 2>$null
          }
          if ($null -ne (Get-Service -Name NebulaMeshAgent -ErrorAction SilentlyContinue)) {
            & sc.exe delete NebulaMeshAgent | Out-Null
          }
          foreach ($path in @($env:AGENT_INSTALL_DIR, $env:AGENT_DATA_DIR)) {
            if ($path -and (Test-Path $path)) {
              Remove-Item -Recurse -Force $path
            }
          }

  # deploy/windows is the one part of the tree no Linux job ever executes: the
  # installer is PowerShell and the wizard's logic is Pascal inside the .iss.
  # Compiling it here is what turns a typo in either into a red PR rather than
  # a broken setup.exe an operator discovers.
  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Parse the PowerShell scripts
        shell: pwsh
        run: |
          $bad = 0
          foreach ($psFile in Get-ChildItem deploy\windows\*.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $psFile.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              $bad += $errors.Count
              foreach ($parseError in $errors) {
                Write-Host ("::error file=deploy/windows/{0},line={1}::{2}" -f `
                  $psFile.Name, $parseError.Extent.StartLineNumber, $parseError.Message)
              }
            } else {
              Write-Host "ok  $($psFile.Name)"
            }
          }
          if ($bad -gt 0) { throw "$bad PowerShell parse error(s)" }

      # ISCC reads a script without a BOM in the system codepage, which turns
      # the Spanish wizard messages into mojibake. It compiles either way, so
      # nothing downstream catches this.
      - name: Check the .iss byte-order mark
        shell: pwsh
        run: |
          $iss = 'deploy\windows\nebula-mesh-setup.iss'
          $head = [byte[]](Get-Content -LiteralPath $iss -AsByteStream -TotalCount 3)
          if ($head.Count -ne 3 -or $head[0] -ne 0xEF -or $head[1] -ne 0xBB -or $head[2] -ne 0xBF) {
            throw "$iss must be UTF-8 with BOM or Inno Setup misreads the es. messages"
          }
          Write-Host "ok  UTF-8 BOM present"

      # Pinned to the version release.yml builds with, so a green PR means the
      # release compile will behave the same. Bump both together.
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version 6.7.1 --no-progress --yes

      - name: Build the installer
        shell: pwsh
        run: .\deploy\windows\build-installer.ps1 -Version 0.0.0

      # A failing child installer used to let Setup exit 0 in /VERYSILENT mode,
      # so deployment systems reported a partially installed host as healthy.
      # A missing local token file fails before any download or enrollment and
      # makes this a deterministic end-to-end check of the setup exit status.
      - name: Reject a failed unattended installation
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\windows-installer\nebula-mesh-setup-0.0.0.exe | Select-Object -First 1).FullName
          $testRoot = Join-Path $env:RUNNER_TEMP ('nebula-mesh-installer-failure-' + [guid]::NewGuid())
          $installDir = Join-Path $testRoot 'install'
          $missingToken = Join-Path $testRoot 'missing-enrollment.token'
          New-Item -ItemType Directory -Force -Path $testRoot | Out-Null
          try {
            & $setup /VERYSILENT /SUPPRESSMSGBOXES /SP- "/DIR=$installDir" `
              /SERVERURL=https://mgmt.example.invalid "/TOKENFILE=$missingToken"
            if ($LASTEXITCODE -eq 0) {
              throw 'silent installer exited 0 after its PowerShell child failed'
            }
          } finally {
            Remove-Item -LiteralPath $testRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: nebula-mesh-setup-ci
          path: dist/windows-installer/*.exe
          if-no-files-found: error

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: nebula-mgmt:ci-${{ github.sha }}
