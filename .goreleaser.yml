version: 2

project_name: nebula-mesh

before:
  hooks:
    - go mod tidy

builds:
  - id: nebula-mgmt
    binary: nebula-mgmt
    main: ./cmd/nebula-mgmt
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: nebula-agent
    binary: nebula-agent
    main: ./cmd/nebula-agent
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: server
    ids: [nebula-mgmt]
    name_template: "nebula-mgmt_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - configs/server.example.yml
      - deploy/systemd/nebula-mgmt.service
      - deploy/systemd/README.md

  - id: agent
    ids: [nebula-agent]
    name_template: "nebula-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - configs/agent.example.yml
      - deploy/systemd/nebula-agent.service
      - deploy/systemd/README.md

dockers:
  - id: server-amd64
    goos: linux
    goarch: amd64
    ids: [nebula-mgmt]
    dockerfile: deploy/docker/Dockerfile.server
    image_templates:
      - "ghcr.io/juev/nebula-mgmt:{{ .Version }}-amd64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=nebula-mgmt"
      - "--label=org.opencontainers.image.description=Self-hosted control plane for Slack Nebula"
      - "--label=org.opencontainers.image.source=https://github.com/juev/nebula-mesh"
      - "--label=org.opencontainers.image.licenses=MIT"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.created={{.Date}}"

  - id: server-arm64
    goos: linux
    goarch: arm64
    ids: [nebula-mgmt]
    dockerfile: deploy/docker/Dockerfile.server
    image_templates:
      - "ghcr.io/juev/nebula-mgmt:{{ .Version }}-arm64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=nebula-mgmt"
      - "--label=org.opencontainers.image.description=Self-hosted control plane for Slack Nebula"
      - "--label=org.opencontainers.image.source=https://github.com/juev/nebula-mesh"
      - "--label=org.opencontainers.image.licenses=MIT"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.created={{.Date}}"

  - id: agent-amd64
    goos: linux
    goarch: amd64
    ids: [nebula-agent]
    dockerfile: deploy/docker/Dockerfile.agent
    image_templates:
      - "ghcr.io/juev/nebula-agent:{{ .Version }}-amd64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title=nebula-agent"
      - "--label=org.opencontainers.image.description=Polling agent for nebula-mesh"
      - "--label=org.opencontainers.image.source=https://github.com/juev/nebula-mesh"
      - "--label=org.opencontainers.image.licenses=MIT"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.created={{.Date}}"

  - id: agent-arm64
    goos: linux
    goarch: arm64
    ids: [nebula-agent]
    dockerfile: deploy/docker/Dockerfile.agent
    image_templates:
      - "ghcr.io/juev/nebula-agent:{{ .Version }}-arm64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title=nebula-agent"
      - "--label=org.opencontainers.image.description=Polling agent for nebula-mesh"
      - "--label=org.opencontainers.image.source=https://github.com/juev/nebula-mesh"
      - "--label=org.opencontainers.image.licenses=MIT"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--label=org.opencontainers.image.created={{.Date}}"

docker_manifests:
  - name_template: "ghcr.io/juev/nebula-mgmt:{{ .Version }}"
    image_templates:
      - "ghcr.io/juev/nebula-mgmt:{{ .Version }}-amd64"
      - "ghcr.io/juev/nebula-mgmt:{{ .Version }}-arm64"
  - name_template: "ghcr.io/juev/nebula-mgmt:latest"
    image_templates:
      - "ghcr.io/juev/nebula-mgmt:{{ .Version }}-amd64"
      - "ghcr.io/juev/nebula-mgmt:{{ .Version }}-arm64"
  - name_template: "ghcr.io/juev/nebula-agent:{{ .Version }}"
    image_templates:
      - "ghcr.io/juev/nebula-agent:{{ .Version }}-amd64"
      - "ghcr.io/juev/nebula-agent:{{ .Version }}-arm64"
  - name_template: "ghcr.io/juev/nebula-agent:latest"
    image_templates:
      - "ghcr.io/juev/nebula-agent:{{ .Version }}-amd64"
      - "ghcr.io/juev/nebula-agent:{{ .Version }}-arm64"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?!?:.+$'
      order: 0
    - title: "Bug fixes"
      regexp: '^.*?fix(\(.+\))?!?:.+$'
      order: 1
    - title: "Performance"
      regexp: '^.*?perf(\(.+\))?!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge conflict"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: juev
    name: nebula-mesh
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
  header: |
    ## nebula-mesh {{ .Tag }}

    **Install** — see [README](https://github.com/juev/nebula-mesh#install) for the full snippets.

    - Server: `nebula-mgmt_{{ .Version }}_<os>_<arch>.tar.gz` or `docker pull ghcr.io/juev/nebula-mgmt:{{ .Version }}`
    - Agent: `nebula-agent_{{ .Version }}_<os>_<arch>.tar.gz` or `docker pull ghcr.io/juev/nebula-agent:{{ .Version }}`
  footer: |
    ---

    **Full changelog**: https://github.com/juev/nebula-mesh/compare/{{ .PreviousTag }}...{{ .Tag }}
