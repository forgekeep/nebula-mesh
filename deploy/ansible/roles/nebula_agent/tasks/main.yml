---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - nebula_agent_server_url | length > 0
      - nebula_agent_enroll_token | length > 0
    fail_msg: "nebula_agent_server_url and nebula_agent_enroll_token must be set per host (pull from Vault)."

- name: Resolve release tag
  ansible.builtin.set_fact:
    nebula_agent_resolved_release: "{{ nebula_agent_release }}"
  when: nebula_agent_release != "latest"

- name: Resolve `latest` release tag from GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/forgekeep/nebula-mesh/releases/latest
    return_content: true
  register: nebula_agent_latest_release
  when: nebula_agent_release == "latest"

- name: Set resolved release (from GitHub API)
  ansible.builtin.set_fact:
    nebula_agent_resolved_release: "{{ nebula_agent_latest_release.json.tag_name }}"
  when: nebula_agent_release == "latest"

- name: Detect target architecture
  ansible.builtin.set_fact:
    nebula_agent_arch: "{{ 'arm64' if ansible_architecture in ['aarch64', 'arm64'] else 'amd64' }}"

- name: Install nebula-agent package
  when: ansible_os_family in ['Debian', 'RedHat']
  block:
    - name: Create private nebula-agent package directory
      ansible.builtin.tempfile:
        state: directory
        mode: '0700'
      register: nebula_agent_package_dir

    - name: Select nebula-agent release package
      ansible.builtin.set_fact:
        nebula_agent_package_name: "nebula-agent_{{ nebula_agent_resolved_release | regex_replace('^v', '') }}_linux_{{ nebula_agent_arch }}{{ '.deb' if ansible_os_family == 'Debian' else '.rpm' }}"

    - name: Download nebula-agent release checksums
      ansible.builtin.uri:
        url: "{{ nebula_agent_release_base_url }}/{{ nebula_agent_resolved_release }}/checksums.txt"
        return_content: true
      register: nebula_agent_release_checksums

    - name: Select nebula-agent package checksum
      ansible.builtin.set_fact:
        nebula_agent_package_checksum_lines: "{{ nebula_agent_release_checksums.content | regex_findall('^[0-9a-f]{64}  ' ~ (nebula_agent_package_name | regex_escape) ~ '$', multiline=True) }}"

    - name: Require exactly one nebula-agent package checksum
      ansible.builtin.assert:
        that:
          - nebula_agent_package_checksum_lines | length == 1
        fail_msg: "checksums.txt must contain exactly one SHA-256 line for {{ nebula_agent_package_name }}"

    - name: Download and verify nebula-agent package
      ansible.builtin.get_url:
        url: "{{ nebula_agent_release_base_url }}/{{ nebula_agent_resolved_release }}/{{ nebula_agent_package_name }}"
        dest: "{{ nebula_agent_package_dir.path }}/{{ nebula_agent_package_name }}"
        mode: '0600'
        checksum: "sha256:{{ nebula_agent_package_checksum_lines[0] | regex_search('^[0-9a-f]{64}') }}"

    - name: Install nebula-agent .deb
      when: ansible_os_family == 'Debian'
      ansible.builtin.apt:
        deb: "{{ nebula_agent_package_dir.path }}/{{ nebula_agent_package_name }}"
        state: present

    - name: Install nebula-agent .rpm
      when: ansible_os_family == 'RedHat'
      ansible.builtin.dnf:
        name: "{{ nebula_agent_package_dir.path }}/{{ nebula_agent_package_name }}"
        state: present
        disable_gpg_check: true
  always:
    - name: Remove private nebula-agent package directory
      ansible.builtin.file:
        path: "{{ nebula_agent_package_dir.path }}"
        state: absent
      when: nebula_agent_package_dir.path is defined

- name: Render agent.yml
  ansible.builtin.template:
    src: agent.yml.j2
    dest: /etc/nebula-agent/agent.yml
    owner: root
    group: root
    mode: '0640'
  notify: restart nebula-agent

- name: Check if host has already enrolled
  ansible.builtin.stat:
    path: "{{ nebula_agent_data_dir }}/.fingerprint"
  register: nebula_agent_fp_stat

- name: Enroll (run once)
  # We use the deprecated `enroll` subcommand here because it is the only
  # one-shot form: the unified `nebula-agent --token …` starts the poller
  # after enrolling, which would block this task forever. See issue #67 for
  # the unified UX; this subcommand is supported for one release.
  when: not nebula_agent_fp_stat.stat.exists
  ansible.builtin.command:
    cmd: >
      nebula-agent enroll
        --server {{ nebula_agent_server_url | quote }}
        --token  {{ nebula_agent_enroll_token | quote }}
        --data-dir {{ nebula_agent_data_dir | quote }}
  changed_when: true
  no_log: true

- name: Enable + start nebula-agent
  ansible.builtin.systemd:
    name: nebula-agent
    enabled: true
    state: started
    daemon_reload: true
