version: 2

project_name: nebula-mesh

before:
  hooks:
    - go mod tidy

builds:
  - id: nebula-mgmt
    binary: nebula-mgmt
    main: ./cmd/nebula-mgmt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: nebula-agent
    binary: nebula-agent
    main: ./cmd/nebula-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - configs/server.example.yml
      - configs/agent.example.yml
      - deploy/**/*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?!?:.+$'
      order: 0
    - title: "Bug fixes"
      regexp: '^.*?fix(\(.+\))?!?:.+$'
      order: 1
    - title: "Performance"
      regexp: '^.*?perf(\(.+\))?!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "merge conflict"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: juev
    name: nebula-mesh
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
  header: |
    ## nebula-mesh {{ .Tag }}

    See [README](https://github.com/juev/nebula-mesh#readme) for quickstart.
  footer: |
    ---

    **Full changelog**: https://github.com/juev/nebula-mesh/compare/{{ .PreviousTag }}...{{ .Tag }}
