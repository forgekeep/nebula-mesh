server_url: "https://mgmt.example.com:8080"
data_dir: "/etc/nebula"
poll_interval: "30s"
nebula_config_path: "/etc/nebula/config.yml"
# Imported installations persist their exact existing PKI paths here. When
# omitted, old configs continue to use <data_dir>/ca.crt, host.crt and host.key.
# nebula_ca_path: "/etc/nebula/ca.crt"
# nebula_cert_path: "/etc/nebula/host.crt"
# nebula_key_path: "/etc/nebula/host.key"
# import_session_id: ""  # managed by nebula-agent during mesh import
nebula_pid_file: "/run/nebula.pid"
# nebula_reload_command: "systemctl reload nebula"  # optional — run via shell instead of the SIGHUP; takes precedence over nebula_pid_file
# nebula_restart_command: "systemctl restart nebula"  # optional — run instead of the reload when a config changes keys nebula reads only at startup
# nebula_binary_path: "/usr/local/bin/nebula"  # optional — binary whose version is reported to the server; default: nebula on PATH
# signing_key_path: "/etc/nebula-agent/host.signing.key"  # default; override for non-root setups (parent dir must be writable by the agent user)
