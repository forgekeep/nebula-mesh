# OpenAPI contract for the nebula-mgmt REST API.
#
# Written by hand and kept in sync with internal/api by the contract tests in
# internal/api/contract_test.go, which validate real handler responses against
# this document (#230). Drift between a handler and this file breaks the build.
#
# Targets OpenAPI 3.1.0, validated with pb33f/libopenapi + libopenapi-validator
# (the contract tests in internal/api/contract_test.go). 3.1 aligns schemas with
# JSON Schema 2020-12; nullable fields would use `type: [..., "null"]`, though
# none are needed today (omitempty fields are omitted, not serialized as null).
openapi: 3.1.0
info:
  title: nebula-mgmt API
  version: "1.0.0"
  description: >
    Control-plane REST API consumed by the CLI, the nebula-agent poller, and
    mobile bundles. Agent endpoints (enroll, agent/updates) are unauthenticated
    at the bearer layer — enroll carries a single-use token, polls carry an
    Ed25519 proof-of-possession signature (ADR 0004). Admin endpoints require an
    operator API key.
servers:
  - url: /

security:
  - bearerAuth: []

paths:
  /api/v1/enroll:
    post:
      operationId: enroll
      summary: Enroll a pending host and receive its signed certificate + config.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
      responses:
        "200":
          description: Enrollment succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/agent/updates:
    get:
      operationId: agentUpdates
      summary: Signed poll for pending certificate / config / revocation updates.
      description: >
        Requires the four ADR 0004 proof-of-possession headers
        (X-Nebula-Fingerprint, X-Nebula-Timestamp, X-Nebula-Nonce,
        X-Nebula-Signature) rather than a bearer token.
      security: []
      parameters:
        - { in: header, name: X-Nebula-Fingerprint, required: true, schema: { type: string } }
        - { in: header, name: X-Nebula-Timestamp, required: true, schema: { type: string } }
        - { in: header, name: X-Nebula-Nonce, required: true, schema: { type: string } }
        - { in: header, name: X-Nebula-Signature, required: true, schema: { type: string } }
      responses:
        "200":
          description: Current update state for the polling host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentUpdatesResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"

  /api/v1/agent/config-ack/{version}:
    post:
      operationId: acknowledgeAgentConfig
      summary: Acknowledge a locally validated and written config version.
      description: Uses the same signed proof-of-possession headers as agent polling.
      security: []
      parameters:
        - { in: path, name: version, required: true, schema: { type: integer, minimum: 1 } }
        - { in: header, name: X-Nebula-Fingerprint, required: true, schema: { type: string } }
        - { in: header, name: X-Nebula-Timestamp, required: true, schema: { type: string } }
        - { in: header, name: X-Nebula-Nonce, required: true, schema: { type: string } }
        - { in: header, name: X-Nebula-Signature, required: true, schema: { type: string } }
      responses:
        "200":
          description: Version applied or already acknowledged.
          content:
            application/json:
              schema:
                type: object
                required: [config_version]
                properties:
                  config_version: { type: integer, minimum: 1 }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/agent/import/challenge:
    post:
      operationId: createAgentImportChallenge
      summary: Validate an existing Nebula host snapshot and create a proof-of-possession challenge.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentImportPayload"
      responses:
        "201":
          description: Short-lived host-key challenge created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentImportChallengeResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "429":
          description: Per-IP request rate or durable active-challenge quota exceeded. Retry-After is expressed in seconds.
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/agent/import:
    post:
      operationId: registerAgentImport
      summary: Register a validated existing Nebula host in a collecting import session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentImportRequest"
      responses:
        "200":
          description: Idempotent retry returned the existing imported host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentImportResponse"
        "201":
          description: Existing host registered in importing state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentImportResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          description: Challenge replay returns `import_challenge_used`; other conflicts return `agent_import_conflict`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: A different snapshot for an already imported certificate returns `import_payload_conflict`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /api/v1/networks:
    get:
      operationId: listNetworks
      summary: List networks visible to the operator.
      responses:
        "200":
          description: Networks.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Network"
    post:
      operationId: createNetwork
      summary: Create a network.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNetworkRequest"
      responses:
        "201":
          description: Created network.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /api/v1/networks/{id}:
    get:
      operationId: getNetwork
      summary: Get a network by id.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Network.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/networks/{id}/mobile-config:
    get:
      operationId: getNetworkMobileConfig
      summary: Get the settings used to generate mobile Nebula profiles.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Mobile profile settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileConfig"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    put:
      operationId: updateNetworkMobileConfig
      summary: Replace the settings used to generate mobile Nebula profiles.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileConfig"
      responses:
        "200":
          description: Updated mobile profile settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileConfig"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/hosts:
    get:
      operationId: listHosts
      summary: List hosts visible to the operator.
      responses:
        "200":
          description: Hosts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Host"
    post:
      operationId: createHost
      summary: Create a host and mint its enrollment token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHostRequest"
      responses:
        "201":
          description: Created host with one-shot enrollment token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateHostResponse"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/hosts/{id}:
    get:
      operationId: getHost
      summary: Get a host by id.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Host.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/blocklist:
    get:
      operationId: getBlocklist
      summary: Certificate fingerprints currently blocked.
      responses:
        "200":
          description: Blocked fingerprints.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /api/v1/audit-log:
    get:
      operationId: getAuditLog
      summary: Audit-log entries.
      responses:
        "200":
          description: Audit entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"

  /api/v1/webhook-subscriptions:
    get:
      operationId: listWebhookSubscriptions
      summary: List webhook subscriptions visible to the operator.
      responses:
        "200":
          description: Subscriptions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookSubscription"
    post:
      operationId: createWebhookSubscription
      summary: Create a webhook subscription.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSubscriptionRequest"
      responses:
        "201":
          description: Created subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
        "400":
          $ref: "#/components/responses/Error"

  /api/v1/webhook-subscriptions/{id}:
    get:
      operationId: getWebhookSubscription
      summary: Get a webhook subscription by id.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateWebhookSubscription
      summary: Update a webhook subscription.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSubscriptionRequest"
      responses:
        "200":
          description: Updated subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteWebhookSubscription
      summary: Delete a webhook subscription.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/Error"

  /api/v1/cas/import:
    post:
      operationId: importCA
      summary: Import an existing Nebula CA certificate and signing key.
      description: >
        This secret-bearing endpoint requires direct TLS, literal-loopback
        HTTP, or an explicitly trusted local TLS-terminating proxy.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CAImportRequest"
      responses:
        "201":
          description: Existing CA imported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CA"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "426":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /api/v1/mesh-imports:
    get:
      operationId: listMeshImports
      summary: List existing-mesh import sessions visible to the operator.
      responses:
        "200":
          description: Import sessions. Bootstrap token hashes are never returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MeshImport"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    post:
      operationId: createMeshImport
      summary: Start collecting an existing Nebula mesh.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMeshImportRequest"
      responses:
        "201":
          description: Session created. The reusable bootstrap token is returned only in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeshImportTokenResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/mesh-imports/{id}:
    get:
      operationId: getMeshImport
      summary: Get an existing-mesh import session without its bootstrap token.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Import session with a deterministic reconciliation preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeshImportDetail"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/mesh-imports/{id}/rotate-token:
    post:
      operationId: rotateMeshImportToken
      summary: Replace a collecting session's reusable bootstrap token.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "201":
          description: Token rotated. The new token is returned only in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeshImportTokenResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/mesh-imports/{id}/cancel:
    post:
      operationId: cancelMeshImport
      summary: Cancel a collecting import and remove only its temporary hosts.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Canceled import session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeshImport"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

  /api/v1/mesh-imports/{id}/finalize:
    post:
      operationId: finalizeMeshImport
      summary: Atomically accept the current reconciliation preview and begin managed operation.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeshImportFinalizeRequest"
      responses:
        "200":
          description: Finalized import session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeshImport"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"

# Outbound webhooks the server POSTs to an operator-configured endpoint (#256).
# Each delivery carries X-Nebula-Event (type), X-Nebula-Delivery (id), and
# X-Nebula-Signature (sha256=<hmac> over the raw body). The handler/scanner emit
# shapes are validated against these schemas by the contract tests.
webhooks:
  host.enrolled:
    post:
      operationId: webhookHostEnrolled
      summary: A host completed enrollment and received its first certificate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostEnrolledEvent"
      responses:
        "2XX":
          description: Acknowledged.
  mesh_import.finalized:
    post:
      operationId: webhookMeshImportFinalized
      summary: An existing-mesh import was atomically finalized.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeshImportFinalizedEvent"
      responses:
        "2XX":
          description: Acknowledged.
  host.blocked:
    post:
      operationId: webhookHostBlocked
      summary: A host was blocked and its certificate revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostEvent"
      responses:
        "2XX":
          description: Acknowledged.
  host.unblocked:
    post:
      operationId: webhookHostUnblocked
      summary: A previously blocked host was unblocked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostEvent"
      responses:
        "2XX":
          description: Acknowledged.
  host.deleted:
    post:
      operationId: webhookHostDeleted
      summary: A host was deleted and its certificate revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostEvent"
      responses:
        "2XX":
          description: Acknowledged.
  cert.rotated:
    post:
      operationId: webhookCertRotated
      summary: A host certificate was re-signed (in-place rotation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertRotatedEvent"
      responses:
        "2XX":
          description: Acknowledged.
  cert.expiring:
    post:
      operationId: webhookCertExpiring
      summary: A host certificate is approaching expiry without renewal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertExpiringEvent"
      responses:
        "2XX":
          description: Acknowledged.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Operator API key as a bearer token.

  responses:
    Error:
      description: Error envelope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    CAImportRequest:
      type: object
      required: [name, certificate, private_key]
      additionalProperties: false
      properties:
        name:
          type: string
        certificate:
          type: string
          format: binary
          description: Nebula CA certificate PEM.
        private_key:
          type: string
          format: binary
          description: Nebula CA signing key PEM. Treat as secret.
        passphrase:
          type: string
          format: binary
          description: Optional passphrase bytes for encrypted key PEM. Treat as secret.

    CA:
      type: object
      required: [id, name, owner_operator_id, cert_pem, fingerprint, not_before, not_after, status, created_at, updated_at, is_default]
      properties:
        id:
          type: string
        name:
          type: string
        owner_operator_id:
          type: string
        cert_pem:
          type: string
        fingerprint:
          type: string
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        status:
          type: string
        predecessor_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        is_default:
          type: boolean

    EnrollRequest:
      type: object
      required: [token, public_key_pem, signing_public_key_pem]
      properties:
        token:
          type: string
          description: Single-use enrollment token. New tokens start with nme_; legacy unprefixed tokens remain valid until expiry.
        public_key_pem:
          type: string
        signing_public_key_pem:
          type: string
        profile:
          $ref: "#/components/schemas/AgentImportProfile"
          description: Optional absolute Nebula file paths and agent capabilities. Omission preserves the /etc/nebula defaults.

    EnrollResponse:
      type: object
      required: [certificate_pem, ca_certificate_pem, config_yaml]
      properties:
        certificate_pem:
          type: string
        ca_certificate_pem:
          type: string
        config_yaml:
          type: string
        config_version:
          type: integer
          minimum: 1

    AgentUpdatesResponse:
      type: object
      required: [has_updates]
      properties:
        has_updates:
          type: boolean
        certificate_pem:
          type: string
        ca_certificate_pem:
          type: string
        config_yaml:
          type: string
        config_version:
          type: integer
          minimum: 1
        blocklist:
          type: array
          items:
            type: string
        import_pending:
          type: boolean
        rekey_required:
          type: boolean
        enrollment_token:
          type: string

    AgentImportProfile:
      type: object
      additionalProperties: false
      required: [nebula_config_path, nebula_ca_path, nebula_cert_path, nebula_key_path, config_ack_v1]
      properties:
        nebula_config_path: { type: string }
        nebula_ca_path: { type: string }
        nebula_cert_path: { type: string }
        nebula_key_path: { type: string }
        config_ack_v1: { type: boolean }

    AgentImportFirewallRule:
      type: object
      additionalProperties: false
      required: [port, proto, group]
      properties:
        port: { type: string }
        proto: { type: string }
        group: { type: string }

    AgentImportFirewallPolicy:
      type: object
      additionalProperties: false
      required: [inbound, outbound]
      properties:
        inbound:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AgentImportFirewallRule" }
        outbound:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/AgentImportFirewallRule" }

    AgentImportUnsafeRoute:
      type: object
      additionalProperties: false
      required: [route, via]
      properties:
        route: { type: string }
        via: { type: string }

    AgentImportConfigSnapshot:
      type: object
      additionalProperties: false
      required: [firewall]
      properties:
        reported_name: { type: string }
        ca_root_fingerprints:
          type: array
          items: { type: string }
        blocklist:
          type: array
          items: { type: string }
        static_host_map:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        lighthouse_hosts:
          type: array
          items: { type: string }
        relays:
          type: array
          items: { type: string }
        am_lighthouse: { type: boolean }
        am_relay: { type: boolean }
        listen_host: { type: string }
        listen_port: { type: integer }
        punchy: { type: boolean }
        mtu: { type: integer }
        tun_device: { type: string }
        unsafe_routes:
          type: array
          items: { $ref: "#/components/schemas/AgentImportUnsafeRoute" }
        firewall:
          $ref: "#/components/schemas/AgentImportFirewallPolicy"
        unsupported_keys:
          type: array
          items: { type: string }

    AgentImportSnapshot:
      type: object
      additionalProperties: false
      required: [id, host_id, certificate_pem, profile, config]
      properties:
        id: { type: string }
        host_id: { type: string }
        certificate_pem: { type: string }
        profile: { $ref: "#/components/schemas/AgentImportProfile" }
        config: { $ref: "#/components/schemas/AgentImportConfigSnapshot" }

    AgentImportPayload:
      type: object
      additionalProperties: false
      required: [token, ca_certificate_pem, agent_signing_public_key_pem, payload_hash, snapshot]
      properties:
        token:
          type: string
          pattern: ^nmi_[A-Za-z0-9_-]+$
        ca_certificate_pem: { type: string }
        agent_signing_public_key_pem: { type: string }
        payload_hash:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        snapshot: { $ref: "#/components/schemas/AgentImportSnapshot" }

    AgentImportRequest:
      type: object
      additionalProperties: false
      required: [token, ca_certificate_pem, agent_signing_public_key_pem, payload_hash, snapshot, challenge_id, proof]
      properties:
        token:
          type: string
          pattern: ^nmi_[A-Za-z0-9_-]+$
        ca_certificate_pem: { type: string }
        agent_signing_public_key_pem: { type: string }
        payload_hash:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
        snapshot: { $ref: "#/components/schemas/AgentImportSnapshot" }
        challenge_id: { type: string }
        proof: { type: string }

    AgentImportChallengeResponse:
      type: object
      required: [challenge_id, session_id, server_public_key, server_nonce, expires_at]
      properties:
        challenge_id: { type: string }
        session_id: { type: string }
        server_public_key: { type: string }
        server_nonce: { type: string }
        expires_at:
          type: string
          format: date-time

    AgentImportResponse:
      type: object
      required: [host_id, certificate_fingerprint, status, created]
      properties:
        host_id: { type: string }
        certificate_fingerprint: { type: string }
        status:
          type: string
          enum: [importing]
        created: { type: boolean }

    CreateNetworkRequest:
      type: object
      required: [name, cidrs]
      properties:
        name:
          type: string
        cidrs:
          type: array
          items:
            type: string
        ca_id:
          type: string

    Network:
      type: object
      required: [id, name, cidrs, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        cidrs:
          type: array
          items:
            type: string
        ca_id:
          type: string
        created_at:
          type: string
          format: date-time

    MobileConfig:
      type: object
      additionalProperties: false
      required: [dns_resolvers, match_domains, allow_private_remotes]
      properties:
        dns_resolvers:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 45
            description: IPv4 or IPv6 address without a zone identifier.
        match_domains:
          type: array
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 253
        allow_private_remotes:
          type: boolean

    CreateHostRequest:
      type: object
      required: [network_id, name, nebula_ips]
      properties:
        network_id:
          type: string
        name:
          type: string
        nebula_ips:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
        role:
          type: string
          enum: [host, lighthouse, relay, lighthouse+relay]
          description: >-
            Host role. `lighthouse+relay` makes the host serve both duties at
            once. `lighthouse`, `relay` and `lighthouse+relay` require
            `public_ip` and `listen_port`.
        public_ip:
          type: string
        listen_port:
          type: integer

    CreateHostResponse:
      type: object
      required: [host, enrollment_token]
      properties:
        host:
          $ref: "#/components/schemas/Host"
        enrollment_token:
          type: string
          pattern: ^nme_[A-Za-z0-9_-]+$

    CreateMeshImportRequest:
      type: object
      required: [network_id, ca_id]
      additionalProperties: false
      properties:
        network_id:
          type: string
        ca_id:
          type: string
        expected_hosts:
          type: integer
          minimum: 1

    MeshImport:
      type: object
      required:
        - id
        - network_id
        - ca_id
        - owner_operator_id
        - ca_fingerprint
        - status
        - revision
        - token_expires_at
        - captured_network_config_version
        - created_at
        - updated_at
      properties:
        id:
          type: string
        network_id:
          type: string
        ca_id:
          type: string
        owner_operator_id:
          type: string
        ca_fingerprint:
          type: string
        status:
          type: string
          enum: [collecting, finalized, canceled]
        expected_hosts:
          type: integer
          minimum: 1
        revision:
          type: integer
          format: int64
          minimum: 0
        token_expires_at:
          type: string
          format: date-time
        captured_network_config_version:
          type: integer
          minimum: 0
        terminal_reason:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        finalized_at:
          type: string
          format: date-time
        canceled_at:
          type: string
          format: date-time

    MeshImportIssue:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        snapshot_id: { type: string }
        host_name: { type: string }
        field: { type: string }
        message: { type: string }

    MeshImportHostProposal:
      type: object
      required: [snapshot_id, profile, host]
      properties:
        snapshot_id: { type: string }
        profile: { $ref: "#/components/schemas/AgentImportProfile" }
        host: { $ref: "#/components/schemas/Host" }

    MeshImportProposal:
      type: object
      required: [hosts, firewall, blocklist]
      properties:
        hosts:
          type: array
          items: { $ref: "#/components/schemas/MeshImportHostProposal" }
        firewall: { $ref: "#/components/schemas/AgentImportFirewallPolicy" }
        blocklist:
          type: array
          items: { type: string }

    MeshImportReport:
      type: object
      required: [blockers, warnings, proposal]
      properties:
        blockers:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/MeshImportIssue" }
        warnings:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/MeshImportIssue" }
        proposal: { $ref: "#/components/schemas/MeshImportProposal" }

    MeshImportWarningAcknowledgement:
      type: object
      required: [key, issue]
      properties:
        key:
          type: string
          pattern: ^[a-f0-9]{64}$
        issue: { $ref: "#/components/schemas/MeshImportIssue" }

    MeshImportDetail:
      type: object
      required: [mesh_import, host_count, expected_count_satisfied, report, warning_acknowledgements]
      properties:
        mesh_import: { $ref: "#/components/schemas/MeshImport" }
        host_count: { type: integer, minimum: 0 }
        expected_count_satisfied: { type: boolean }
        report: { $ref: "#/components/schemas/MeshImportReport" }
        warning_acknowledgements:
          type: array
          items: { $ref: "#/components/schemas/MeshImportWarningAcknowledgement" }

    MeshImportFinalizeRequest:
      type: object
      additionalProperties: false
      required: [revision, inventory_complete]
      properties:
        revision: { type: integer, format: int64, minimum: 0 }
        inventory_complete: { type: boolean }
        acknowledged_warnings:
          type: [array, "null"]
          items:
            type: string
            pattern: ^[a-f0-9]{64}$

    MeshImportTokenResponse:
      type: object
      required: [mesh_import, token]
      properties:
        mesh_import:
          $ref: "#/components/schemas/MeshImport"
        token:
          type: string
          pattern: ^nmi_[A-Za-z0-9_-]+$

    Host:
      type: object
      required:
        - id
        - network_id
        - name
        - nebula_ips
        - groups
        - role
        - is_lighthouse
        - is_relay
        - status
        - kind
        - created_at
        - updated_at
      properties:
        id:
          type: string
        network_id:
          type: string
        ca_id:
          type: string
        name:
          type: string
        nebula_ips:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
        role:
          type: string
          enum: [host, lighthouse, relay, lighthouse+relay]
        is_lighthouse:
          type: boolean
        is_relay:
          type: boolean
        public_ip:
          type: string
        listen_port:
          type: integer
        status:
          type: string
        cert_fingerprint:
          type: string
        prev_cert_fingerprint:
          type: string
        cert_expires_at:
          type: string
          format: date-time
        cert_rotated_at:
          type: string
          format: date-time
        pending_rekey:
          type: boolean
        signing_pub_pem:
          type: string
        last_seen_at:
          type: string
          format: date-time
        kind:
          type: string
        variant:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AuditEntry:
      type: object
      required: [id, timestamp, actor, action, resource]
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        resource:
          type: string
        details:
          type: string

    # --- Webhook event envelopes (#256) ---

    HostEventData:
      type: object
      required: [host_id, host_name, network_id, ca_id]
      properties:
        host_id:
          type: string
        host_name:
          type: string
        network_id:
          type: string
        ca_id:
          type: string

    HostEnrolledData:
      type: object
      required: [host_id, host_name, network_id, ca_id, fingerprint]
      properties:
        host_id:
          type: string
        host_name:
          type: string
        network_id:
          type: string
        ca_id:
          type: string
        fingerprint:
          type: string

    MeshImportFinalizedData:
      type: object
      required: [mesh_import_id, network_id, ca_id, host_count]
      properties:
        mesh_import_id: { type: string }
        network_id: { type: string }
        ca_id: { type: string }
        host_count: { type: integer, minimum: 1 }

    CertExpiringData:
      type: object
      required: [host_id, host_name, network_id, ca_id, fingerprint, not_after, seconds_until_expiry]
      properties:
        host_id:
          type: string
        host_name:
          type: string
        network_id:
          type: string
        ca_id:
          type: string
        fingerprint:
          type: string
        not_after:
          type: string
          format: date-time
        seconds_until_expiry:
          type: number

    HostEvent:
      type: object
      required: [id, type, created_at, data]
      properties:
        id:
          type: string
        type:
          type: string
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/HostEventData"

    HostEnrolledEvent:
      type: object
      required: [id, type, created_at, data]
      properties:
        id:
          type: string
        type:
          type: string
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/HostEnrolledData"

    MeshImportFinalizedEvent:
      type: object
      required: [id, type, created_at, data]
      properties:
        id: { type: string }
        type: { type: string }
        created_at: { type: string, format: date-time }
        data: { $ref: "#/components/schemas/MeshImportFinalizedData" }

    CertRotatedEvent:
      type: object
      required: [id, type, created_at, data]
      properties:
        id:
          type: string
        type:
          type: string
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/HostEnrolledData"

    CertExpiringEvent:
      type: object
      required: [id, type, created_at, data]
      properties:
        id:
          type: string
        type:
          type: string
        created_at:
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/CertExpiringData"

    # --- Managed webhook subscriptions (#256 phase 2) ---

    WebhookSubscriptionRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
        events:
          type: ["array", "null"]
          items:
            type: string
        active:
          type: boolean
        allow_private:
          type: boolean
          description: >-
            Opt a private/loopback/link-local delivery target out of the SSRF
            guard. Admin role only; a non-admin operator setting this gets 403.
        secret:
          type: string
          description: Write-only HMAC secret. Omit to keep, "" to clear, value to set.

    WebhookSubscription:
      type: object
      required: [id, owner_operator_id, url, active, allow_private, has_secret, consecutive_failures, created_at, updated_at]
      properties:
        id:
          type: string
        owner_operator_id:
          type: string
        url:
          type: string
        events:
          type: ["array", "null"]
          items:
            type: string
        active:
          type: boolean
        allow_private:
          type: boolean
        has_secret:
          type: boolean
        last_delivery_at:
          type: string
          format: date-time
        last_status:
          type: string
        last_error:
          type: string
        consecutive_failures:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
